<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>phone-loneliness — passive-aggressive phone</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #111111;
      --elevated: #1A1A1A;
      --border: #262626;
      --border-strong: #333333;
      --text: #EDEDED;
      --text-dim: #A1A1A1;
      --text-muted: #707070;
      --accent: #EDEDED;
      --accent-fg: #0A0A0A;
      --danger: #F84E4E;
      --success: #4ADE80;
      --warning: #FBBF24;
      --radius-sm: 4px;
      --radius: 6px;
      --radius-lg: 10px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      /* Back-compat aliases. */
      --panel: var(--surface);
      --panel-2: var(--elevated);
      --muted: var(--text-dim);
      --ok: var(--success);
      --warn: var(--warning);
      --error: var(--danger);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
      font-feature-settings: "cv11", "ss01", "tnum";
      -webkit-font-smoothing: antialiased;
    }
    button {
      background: var(--elevated); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
      transition: background 0.1s ease, border-color 0.1s ease;
    }
    button:hover { background: var(--border); border-color: var(--border-strong); }
    button:active { background: var(--border-strong); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.primary:hover { filter: brightness(1.12); }
    button.danger { background: var(--danger); border-color: var(--danger); color: white; }
    button.danger:hover { filter: brightness(1.12); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, select, textarea {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 10px; font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.1s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }
    code, pre { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 6px; font-size: 12px; }
    pre { padding: var(--space-3); overflow-x: auto; }
    hr { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }
    h1, h2, h3 { font-weight: 600; margin: 0 0 var(--space-3); letter-spacing: -0.01em; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; }
    h3 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: var(--text-dim); }
    .dim { color: var(--text-muted); }

    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
      flex-shrink: 0;
    }
    header h1 { font-size: 14px; color: var(--text); letter-spacing: 0.02em; margin: 0; }
    .hint { font-size: 11px; color: var(--text-dim); }
    .status { margin-left: auto; font-size: 11px; color: var(--text-dim); }

    main {
      flex: 1; display: grid; min-height: 0; overflow: hidden;
      grid-template-columns: 280px 1fr 320px; gap: 1px; background: var(--border);
    }
    .pane { background: var(--bg); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .pane h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-dim); padding: 8px 12px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0; margin: 0;
    }
    .pane-body { flex: 1; overflow: auto; padding: 12px; min-height: 0; }

    .device {
      padding: 10px 12px; margin-bottom: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .device .id { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .badge { font-size: 10px; padding: 1px 7px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-dim); }
    .badge.still { color: var(--warning); border-color: var(--border-strong); }
    .badge.active { color: var(--success); border-color: var(--border-strong); }
    .badge.exhausted { color: var(--text-muted); }
    .badge.error { color: var(--danger); border-color: var(--border-strong); }

    .lang-row { display: flex; gap: 8px; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .lang-row label { font-size: 11px; color: var(--text-dim); }

    .log {
      padding: 8px 12px; font-family: var(--font-mono); font-size: 12px;
      white-space: pre-wrap; word-break: break-word;
    }
    .utt {
      padding: 8px 10px; margin-bottom: 6px; background: var(--surface);
      border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
    }
    .utt.pickup { border-left-color: var(--success); background: var(--elevated); }
    .utt.pickup .meta::before { content: '✋ pickup · '; color: var(--success); }
    .utt.error { border-left-color: var(--danger); background: var(--elevated); }
    .utt .meta { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
    .utt .text { color: var(--text); font-size: 13px; font-style: italic; }
    .empty { color: var(--text-dim); font-style: italic; padding: 16px; text-align: center; font-size: 12px; }

    /* — cache panel — */
    .cache-lang {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 8px; overflow: hidden;
    }
    .cache-lang.current { border-color: var(--accent); }
    .cache-lang-head {
      padding: 6px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px;
      background: var(--elevated); border-bottom: 1px solid var(--border);
    }
    .cache-lang-head .lab { font-weight: 600; }
    .cache-lang-head .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
    .cache-lang-head .cooking { font-size: 10px; color: var(--accent); }
    .cache-quip {
      padding: 6px 10px; border-top: 1px dashed var(--border); font-size: 12px;
      color: var(--text); font-style: italic;
    }
    .cache-quip:first-of-type { border-top: 0; }
    .cache-quip .idx { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>phone-loneliness</h1>
    <div class="hint">Detects when your phone is put down and shames you via TTS.</div>
    <div class="status" id="status">connecting…</div>
  </header>

  <main>
    <div class="pane">
      <h2>Devices</h2>
      <div class="lang-row">
        <label for="lang">Speak in</label>
        <select id="lang">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="fr-FR">Français</option>
          <option value="es-ES">Español</option>
          <option value="de-DE">Deutsch</option>
          <option value="it-IT">Italiano</option>
          <option value="pt-PT">Português</option>
          <option value="ja-JP">日本語</option>
        </select>
      </div>
      <div class="lang-row" style="border-bottom: 1px solid var(--border); justify-content: space-between;">
        <div style="display: flex; gap: 6px; align-items: center;">
          <label for="period">Every</label>
          <input type="number" id="period" min="1" max="60" step="1" style="width: 60px;" /> <span class="hint">s</span>
        </div>
        <div class="hint" id="cache-badge">cache —</div>
      </div>
      <div class="pane-body" id="devices">
        <div class="empty">No phone has reported yet. Connect brAIn-mobile and put the phone on a table.</div>
      </div>
    </div>

    <div class="pane">
      <h2>Recent shame</h2>
      <div class="pane-body log" id="log">
        <div class="empty">The phone hasn't complained yet. Yet.</div>
      </div>
    </div>

    <div class="pane">
      <h2>Cache map <span class="hint" style="margin-left: auto;" id="cache-target-hint"></span></h2>
      <div class="pane-body" id="cache-panel">
        <div class="empty">Pre-warming…</div>
      </div>
    </div>
  </main>

  <script>
    const nodeId = window.location.pathname.split('/node/')[1]?.split('/ui')[0];
    const apiBase = window.location.origin;

    const els = {
      status: document.getElementById('status'),
      devices: document.getElementById('devices'),
      log: document.getElementById('log'),
      lang: document.getElementById('lang'),
      period: document.getElementById('period'),
    };

    const devices = new Map(); // deviceId → {state, since, count, language}
    let lastMessageId = null;
    let language = 'en-US';
    let periodS = 3;

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function loadConfig() {
      try {
        const res = await fetch(`${apiBase}/network`);
        const data = await res.json();
        const me = data.nodes?.find((n) => n.id === nodeId);
        if (!me) return;
        const o = me.config_overrides ?? {};
        if (typeof o.language === 'string') { language = o.language; els.lang.value = language; }
        if (typeof o.utterance_period_ms === 'number') {
          periodS = Math.round(o.utterance_period_ms / 1000);
          els.period.value = String(periodS);
        } else {
          els.period.value = '3';
        }
      } catch (e) { /* ignore */ }
    }

    async function patchConfig(body) {
      try {
        await fetch(`${apiBase}/nodes/${nodeId}/config`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        els.status.textContent = 'config saved';
        setTimeout(() => { els.status.textContent = `${devices.size} device(s)`; }, 1200);
      } catch (e) {
        els.status.textContent = `save failed: ${e.message}`;
      }
    }

    els.lang.addEventListener('change', () => {
      language = els.lang.value;
      patchConfig({ language });
      // Refresh the badge against whatever we last saw for the new lang.
      updateCacheBadge(language,
        cacheByLang.get(language)?.size ?? 0,
        cacheByLang.get(language)?.inflight ?? 0);
    });

    els.period.addEventListener('change', () => {
      const v = Math.max(1, Math.min(60, Number(els.period.value) || 3));
      els.period.value = String(v);
      periodS = v;
      patchConfig({ utterance_period_ms: v * 1000 });
    });

    async function pollMessages() {
      try {
        const res = await fetch(`${apiBase}/node/${nodeId}/messages`);
        if (!res.ok) { els.status.textContent = 'node not running'; return; }
        const messages = await res.json();
        let startIdx = 0;
        if (lastMessageId) {
          const idx = messages.findIndex((m) => m.id === lastMessageId);
          if (idx >= 0) startIdx = idx + 1;
        }
        for (const msg of messages.slice(startIdx)) {
          dispatch(msg);
          lastMessageId = msg.id;
        }
        els.status.textContent = `${devices.size} device(s) tracked`;
      } catch (e) {
        els.status.textContent = 'disconnected';
      }
    }

    function dispatch(msg) {
      if (msg.topic === 'phone-loneliness.cache') {
        const meta = msg.metadata || {};
        renderCacheMap(meta.target ?? 5, meta.langs ?? {}, meta.pickup_target ?? 3, meta.pickup ?? {});
        return;
      }
      if (msg.topic !== 'phone-loneliness.status') return;
      const meta = msg.metadata || {};
      const deviceId = meta.deviceId;
      if (!deviceId) return;
      // Cache pseudo-device — surfaced separately, not in the device list.
      if (deviceId.startsWith('__')) {
        if (meta.state === 'cache.size') updateCacheBadge(meta.language, meta.size, meta.inflight);
        return;
      }
      // Pickup is a one-shot event, not a persistent state — log it but
      // don't pin the device's badge to "pickup".
      if (meta.state === 'pickup' && typeof meta.text === 'string') {
        appendLog(deviceId, meta.text, meta.language ?? 'en-US', msg.timestamp, 'pickup');
        return;
      }
      // Phone went silent — the node dropped it, so drop it here too.
      if (meta.state === 'disconnected') {
        devices.delete(deviceId);
        renderDevices();
        return;
      }
      const cur = devices.get(deviceId) ?? { state: 'unknown', motion: 'moving', count: 0, language: 'en-US' };
      cur.state = meta.state ?? cur.state;
      cur.count = meta.count ?? cur.count;
      cur.since = meta.since ?? cur.since;
      cur.language = meta.language ?? cur.language;
      // The motion badge is driven ONLY by the heartbeat states, so a transient
      // "uttered" / "exhausted" (which fire while the phone is put down) never
      // flips the badge to "in motion".
      if (meta.state === 'still') cur.motion = 'still';
      else if (meta.state === 'active' || meta.state === 'tracking') cur.motion = 'moving';
      devices.set(deviceId, cur);
      renderDevices();
      if (meta.state === 'uttered' && typeof meta.text === 'string') {
        appendLog(deviceId, meta.text, meta.language ?? 'en-US', msg.timestamp);
      }
      if (meta.state === 'error' && typeof meta.error === 'string') {
        appendLog(deviceId, `⚠ ${meta.error}`, '', msg.timestamp, 'error');
      }
    }

    function renderDevices() {
      if (devices.size === 0) {
        els.devices.innerHTML = '<div class="empty">No phone has reported yet.</div>';
        return;
      }
      els.devices.innerHTML = '';
      for (const [id, d] of devices) {
        const div = document.createElement('div');
        div.className = 'device';
        const still = d.motion === 'still';
        const secs = still && d.since ? Math.max(0, Math.round((Date.now() - d.since) / 1000)) : 0;
        const label = still
          ? `📴 Posé${secs ? ` depuis ${secs}s` : ''}`
          : '📱 En mouvement';
        div.innerHTML = `
          <div class="id">${escapeHtml(id)}</div>
          <div class="badges">
            <span class="badge ${still ? 'still' : 'active'}">${label}</span>
            ${d.count ? `<span class="badge muted">${d.count} quip${d.count > 1 ? 's' : ''}</span>` : ''}
          </div>
        `;
        els.devices.appendChild(div);
      }
    }

    const cacheByLang = new Map();
    function updateCacheBadge(lang, size, inflight) {
      cacheByLang.set(lang, { size: Number(size) || 0, inflight: Number(inflight) || 0 });
      const cur = cacheByLang.get(language) ?? { size: 0, inflight: 0 };
      const badge = document.getElementById('cache-badge');
      if (badge) {
        const il = cur.inflight > 0 ? ` (+${cur.inflight} cooking)` : '';
        badge.textContent = `cache ${cur.size}${il}`;
      }
    }

    /** Render the per-language quip map. Two sub-sections per language:
     *  the still-episode quips and the pickup-line cache. */
    function renderCacheMap(target, langs, pickupTarget, pickup) {
      const targetHint = document.getElementById('cache-target-hint');
      if (targetHint) targetHint.textContent = `still ${target} · pickup ${pickupTarget}`;
      const root = document.getElementById('cache-panel');
      const allLangs = new Set([...Object.keys(langs), ...Object.keys(pickup)]);
      if (allLangs.size === 0) {
        root.innerHTML = '<div class="empty">Pre-warming…</div>';
        return;
      }
      // Selected language first, then by descending main queue depth.
      const entries = [...allLangs].sort((a, b) => {
        if (a === language) return -1;
        if (b === language) return 1;
        return (langs[b]?.quips?.length ?? 0) - (langs[a]?.quips?.length ?? 0);
      });
      const frag = document.createDocumentFragment();
      for (const lang of entries) {
        const stillData = langs[lang] ?? { quips: [], inflight: 0 };
        const pickData = pickup[lang] ?? { quips: [], inflight: 0 };
        const div = document.createElement('div');
        div.className = `cache-lang${lang === language ? ' current' : ''}`;
        const head = document.createElement('div');
        head.className = 'cache-lang-head';
        head.innerHTML = `<span class="lab">${escapeHtml(lang)}</span>`;
        div.appendChild(head);
        div.appendChild(renderCacheSubsection('still episode', stillData.quips || [], stillData.inflight || 0, target, 'accent'));
        div.appendChild(renderCacheSubsection('pickup line', pickData.quips || [], pickData.inflight || 0, pickupTarget, 'ok'));
        frag.appendChild(div);
      }
      root.replaceChildren(frag);
    }

    function renderCacheSubsection(label, quips, inflight, target, accent) {
      const wrap = document.createElement('div');
      wrap.style.borderTop = '1px solid var(--border)';
      const sub = document.createElement('div');
      sub.className = 'cache-lang-head';
      sub.style.background = 'transparent';
      sub.style.borderBottom = '0';
      sub.innerHTML = `
        <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--${accent});">${label}</span>
        ${inflight > 0 ? `<span class="cooking">${inflight} cooking</span>` : ''}
        <span class="count">${quips.length} / ${target}</span>
      `;
      wrap.appendChild(sub);
      if (quips.length === 0) {
        const e = document.createElement('div');
        e.className = 'cache-quip';
        e.style.color = 'var(--muted)';
        e.textContent = inflight > 0 ? '…cooking' : 'empty';
        wrap.appendChild(e);
      } else {
        quips.forEach((q, i) => {
          const item = document.createElement('div');
          item.className = 'cache-quip';
          item.innerHTML = `<span class="idx">${i + 1}</span>${escapeHtml(q)}`;
          wrap.appendChild(item);
        });
      }
      return wrap;
    }

    function appendLog(deviceId, text, lang, ts, klass = '') {
      const empty = els.log.querySelector('.empty');
      empty?.remove();
      const div = document.createElement('div');
      div.className = `utt ${klass}`;
      const t = ts ? new Date(ts).toLocaleTimeString() : '';
      div.innerHTML = `
        <div class="meta">${escapeHtml(t)} · <code>${escapeHtml(deviceId.slice(0, 12))}</code> · ${escapeHtml(lang)}</div>
        <div class="text">${escapeHtml(text)}</div>
      `;
      els.log.insertBefore(div, els.log.firstChild);
      while (els.log.children.length > 30) els.log.lastChild.remove();
    }

    loadConfig();
    pollMessages();
    setInterval(pollMessages, 1500);
    setInterval(loadConfig, 8000);
  </script>
</body>
</html>
